[package]
name = "turbocommander-lite"
version = "0.3.0"
edition = "2024"
description = "TurboCommander Lite – fast dual-pane file manager for Windows (free edition)"
license = "MIT"

[[bin]]
name = "TurboCommanderLite"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "fill"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
notify = "8"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

# Vom Makro "implement" (Ablegen aus anderen Programmen per OLE) unter diesem Namen erwartet
windows-core = "0.62"

# Für das Hinausziehen von Dateien in andere Programme (COM/OLE) und Programmsymbole;
# dieselbe Version nutzt bereits „trash".
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
]

[build-dependencies]
winresource = "0.1"

# Eigener Code schnell kompiliert, Abhängigkeiten voll optimiert:
# so bleibt die Entwicklungs-exe flüssig.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
